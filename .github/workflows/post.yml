name: Auto Post to X

permissions:
  contents: write

on:
  schedule:
    # JST 07:30 = UTC 22:30 (previous day)
    - cron: '30 22 * * *'
    # JST 10:00 = UTC 01:00
    - cron: '0 1 * * *'
    # JST 12:00 = UTC 03:00
    - cron: '0 3 * * *'
    # JST 15:00 = UTC 06:00
    - cron: '0 6 * * *'
    # JST 18:00 = UTC 09:00
    - cron: '0 9 * * *'
    # JST 20:00 = UTC 11:00
    - cron: '0 11 * * *'
    # JST 22:30 = UTC 13:30
    - cron: '30 13 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type (quiz, meme, tips, promo)'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libxtst6 \
            fonts-noto-cjk

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          POST_TYPE: ${{ github.event.inputs.post_type }}
        run: npx tsx src/post.ts

      - name: Commit posted status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "bot: mark post as posted [skip ci]"
          git push
