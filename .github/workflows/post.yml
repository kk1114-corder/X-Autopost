name: Auto Post to X

on:
  schedule:
    # JST 07:00 = UTC 22:00 (previous day)
    - cron: '0 22 * * *'
    # JST 12:00 = UTC 03:00
    - cron: '0 3 * * *'
    # JST 18:00 = UTC 09:00
    - cron: '0 9 * * *'
    # JST 21:00 = UTC 12:00
    - cron: '0 12 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type (quiz, meme, tips, promo)'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          POST_TYPE: ${{ github.event.inputs.post_type }}
        run: npx tsx src/post.ts

      - name: Commit posted status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "bot: mark post as posted [skip ci]"
          git push
